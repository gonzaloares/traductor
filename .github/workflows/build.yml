name: Build and typecheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test src/lib/translation-diff.test.mjs
      - run: node --experimental-strip-types --test src/lib/types.test.mjs
      - run: node --experimental-strip-types --test src/lib/grammar-topics.test.mjs
      - run: node --experimental-strip-types --test supabase/functions/parole-api/evaluation-quality.test.mjs
      - run: npm run typecheck
      - run: npm run build
